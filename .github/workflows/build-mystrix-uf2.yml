name: Mystrix CFW Async CDC Peak Diagnostics
on:
  push:
    branches:
      - fix/async-cdc-metrics-20261105
  workflow_dispatch:
jobs:
  uf2:
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v5.3.3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile ESP32-S3 and make DFU-ready UF2
        shell: bash
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build
          python3 tools/generate_mystrix_uf2.py build/Mystrix_CFW.bin build/Mystrix-CFW-1.0.1-3ms-CDC-ASYNC-PEAKDIAG.uf2
      - name: Upload DFU UF2
        uses: actions/upload-artifact@v4
        with:
          name: Mystrix-CFW-1.0.1-3ms-CDC-ASYNC-PEAKDIAG-DFU
          path: build/Mystrix-CFW-1.0.1-3ms-CDC-ASYNC-PEAKDIAG.uf2
          if-no-files-found: error
